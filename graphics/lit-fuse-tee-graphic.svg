<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Lit fuse coffee bean mark</title>
  <desc id="desc">A coffee bean with a lit fuse coming out the top, for the Lit Fuse Tee.</desc>

  <!-- fuse cord -->
  <path d="M100 70 C 96 58, 108 52, 104 40 C 116 46, 112 60, 100 70" fill="none" stroke="#F2E8D8" stroke-width="5" stroke-linecap="round"/>

  <!-- flame at the fuse tip -->
  <path d="M96 42 C 94 34, 104 32, 100 24 C 110 28, 108 40, 98 46 C 95 45, 96 42, 96 42Z" fill="#D6401C"/>
  <path d="M99 39 C 98 34, 103 33, 101 28 C 106 30, 105 37, 100 40 C 98 39, 99 39, 99 39Z" fill="#F2A93C"/>

  <!-- coffee bean body -->
  <path d="M100 72 C 128 72, 148 94, 148 122 C 148 150, 128 172, 100 172 C 72 172, 52 150, 52 122 C 52 94, 72 72, 100 72Z" fill="#F2E8D8"/>
  <path d="M100 80 C 96 96, 96 148, 100 164" fill="none" stroke="#4A4038" stroke-width="6" stroke-linecap="round"/>
</svg>
