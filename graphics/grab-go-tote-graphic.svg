  <path d="M102 66 C 100 71, 95 73, 95 79 C 95 84, 99 88, 104 88 C 110 88, 114 83, 114 78 C 114 74, 112 71, 109 68 C 110 72, 107 75, 105 77 C 106 73, 105 69, 102 66Z" fill="#F2A93C"/>

